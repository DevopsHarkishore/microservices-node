apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-app
  template:
    metadata:
      labels:
        app: book-app
    spec:
      containers:
      - name: book-app
        image: harkishore/book-image:v1
        ports:
        - containerPort: 3000
        env:
        - name: MONGO_DB_URI
          value: mongodb://admin:admin123@mongodb-service:27017/microservices?authSource=admin
