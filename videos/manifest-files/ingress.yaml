apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myvideos-ingress
spec:
  ingressClassName: azure-application-gateway
  rules:
  - host: myvideos.techno028.shop
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: myvideos-service
            port:
              number: 9090